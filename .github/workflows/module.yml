name: Module Common CI
on:
  workflow_call:
    inputs:
      package-path:
        required: true
        type: string

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  # Setting an environment variable with the value of a configuration variable
  PUBLISH_BRANCH: "refs/heads/main"
  PACKAGE_NAME: "unknown"
  PACKAGE_VERSION: "unknown"
  NPM_VERSION: "unknown"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: luolapeikko/github-actions/read-package-info@e320bbeabb85a5b484eb3ecdf5a839492307ff83 # v0
        with:
          working-directory: ${{ inputs.package-path }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace deps
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Validate
        run: pnpm run validate

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Publish ${{env.PACKAGE_NAME}} ${{env.PACKAGE_VERSION}}
        working-directory: ${{ inputs.package-path }}
        if: |
          github.ref == env.PUBLISH_BRANCH &&
          env.PACKAGE_VERSION != env.NPM_VERSION
        run: npm publish --access public

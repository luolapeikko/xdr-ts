name: onc-xdr CI
on:
  push:
    branches: [main]
    paths:
      - "packages/onc-xdr/**"
      - ".github/workflows/onc-xdr.yml"
      - ".github/workflows/module.yml"

permissions:
  id-token: write
  contents: read

jobs:
  module-flow:
    uses: ./.github/workflows/module.yml
    with:
      package-path: packages/onc-xdr
